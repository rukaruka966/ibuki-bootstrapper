name: Feature request
description: Describe an outcome that Ibuki should make possible.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the result that would satisfy the request. An AI
        agent will derive implementation details, tests, and completion criteria.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the area closest to the requested outcome.
      options:
        - Bootstrapper execution
        - Blueprint generation
        - Common repository assets
        - GitHub provisioning and rules
        - CI and release
        - Documentation
        - Unsure

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the limitation, friction, or unmet need to solve.
      placeholder: What is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome and human acceptance
      description: Describe the observable result that would make the request complete.
      placeholder: What should a person be able to do or observe?
    validations:
      required: true

  - type: dropdown
    id: responsibility-boundary
    attributes:
      label: Responsibility boundary
      description: Select where you believe the requested behavior belongs. Choose Unsure when the boundary needs investigation.
      options:
        - Ibuki or Bootstrapper behavior
        - Generated file contract
        - Generated-project behavior
        - GitHub provisioning or repository operations
        - Unsure

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List behavior or artifacts that should be included, when already known.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List behavior or artifacts that should not be changed, when already known.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and stop conditions
      description: Note request-specific compatibility, safety, or decisions that require human confirmation.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized alternatives, related issues, examples, or reference material.

  - type: checkboxes
    id: public-report-safety
    attributes:
      label: Public report safety
      description: Confirm that this public issue is safe to publish.
      options:
        - label: This issue contains no secrets, tokens, personal information, private URLs, or local private paths.
          required: true
        - label: This issue contains no undisclosed security vulnerability details.
          required: true
